<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AFK Bot Panel</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#21262d;--tx:#e6edf3;--mu:#8b949e;--ok:#3fb950;--bad:#f85149;--warn:#e3b341;--acc:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;padding:calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto}
h1{font-size:22px;margin:0 0 14px}
h3{margin:0 0 4px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.state{display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--ok)}.dot.wait{background:var(--warn)}
.big{font-weight:700;font-size:18px}.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:16px;word-break:break-all}
button{font:inherit;font-weight:600;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx);min-height:46px;padding:0 14px;cursor:pointer}
button:disabled{opacity:.4}
.go{border-color:#238636;color:var(--ok);background:#0d2218}
.stop{border-color:#da3633;color:var(--bad);background:#200d0d}
section{display:none}section.show{display:block}
#log{height:55vh;overflow:auto;background:#010409;border:1px solid var(--line);border-radius:10px;padding:10px;font:12px/1.6 ui-monospace,Menlo,monospace}
#log div{white-space:pre-wrap;word-break:break-word;color:var(--mu)}
#log .e{color:var(--bad)}#log .w{color:var(--warn)}#log .s{color:var(--ok)}#log .c{color:var(--acc)}
.row{display:flex;gap:8px;margin-top:10px}
input[type=text],input[type=number],input[type=password],select,textarea{width:100%;background:#010409;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
label.sw{display:flex;justify-content:space-between;align-items:center;margin:0;padding:10px 0;border-bottom:1px solid var(--line);color:var(--tx);font-size:15px}
.sw input{width:22px;height:22px}
#save{width:100%}
.bot{display:flex;align-items:center;gap:10px;padding:12px}.bot .info{flex:1;min-width:0}.bot button{min-height:38px;padding:0 12px}
.tag{font-size:11px;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:0 6px;margin-left:4px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mu);min-height:56px}
nav button.on{color:var(--tx);box-shadow:inset 0 2px var(--ok)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));background:#30363d;padding:12px;border-radius:10px;text-align:center;display:none}
</style></head>
<body><main>
<h1>AFK Bot Panel</h1>

<section id="t-status" class="show">
  <div class="card state"><div class="dot" id="dot"></div>
    <div><div class="big" id="st">Memuat…</div><div class="mu" id="sd"></div></div></div>
  <div class="grid" style="margin-bottom:12px">
    <button class="go" id="start">Start semua</button><button class="stop" id="stop">Stop semua</button>
  </div>
  <div class="card grid">
    <div class="stat"><span class="mu">Server</span><b id="srv">—</b></div>
    <div class="stat"><span class="mu">Bot online</span><b id="cnt">—</b></div>
  </div>
  <div id="bots"></div>
  <div class="row" style="margin:0 0 12px"><input type="text" id="newbot" placeholder="Username bot baru" autocapitalize="off"><button class="go" id="add">Tambah</button></div>
</section>

<section id="t-logs">
  <div id="log"></div>
  <div class="row" style="margin:0 0 10px"><select id="tgt"><option value="all">Semua bot</option></select></div>
  <div class="row"><input type="text" id="cmd" placeholder="Chat atau /command" autocomplete="off" autocapitalize="off"><button class="go" id="send">Kirim</button></div>
  <p class="mu">Ketik /help untuk daftar perintah.</p>
</section>

<section id="t-settings">
  <div class="card">
    <h3>Server</h3>
    <label>IP / hostname</label><input type="text" data-k="server.ip" autocapitalize="off">
    <label>Port</label><input type="number" data-k="server.port" inputmode="numeric">
    <label>Versi (kosongkan = otomatis)</label><input type="text" data-k="server.version" placeholder="mis. 1.20.1">
  </div>
  <div class="card">
    <h3>Akun bot utama</h3>
    <label>Username</label><input type="text" data-k="bot-account.username" autocapitalize="off">
    <label>Tipe login</label>
    <select data-k="bot-account.type"><option value="offline">offline (cracked)</option><option value="microsoft">microsoft</option></select>
    <label>Password (hanya untuk microsoft)</label><input type="password" data-k="bot-account.password">
    <label class="sw" style="margin-top:8px"><span>Auto /login /register</span><input type="checkbox" data-k="utils.auto-auth.enabled"></label>
    <label>Password auto-login</label><input type="password" data-k="utils.auto-auth.password">
  </div>
  <div class="card">
    <h3>Perilaku</h3>
    <label class="sw"><span>Anti-AFK</span><input type="checkbox" data-k="utils.anti-afk.enabled"></label>
    <label class="sw"><span>Jalan memutar</span><input type="checkbox" data-k="movement.circle-walk.enabled"></label>
    <label class="sw"><span>Lihat sekeliling</span><input type="checkbox" data-k="movement.look-around.enabled"></label>
    <label class="sw"><span>Lompat acak</span><input type="checkbox" data-k="movement.random-jump.enabled"></label>
    <label class="sw"><span>Combat (serang mob)</span><input type="checkbox" data-k="modules.combat"></label>
    <label class="sw"><span>Chat otomatis</span><input type="checkbox" data-k="utils.chat-messages.enabled"></label>
    <label>Jeda chat (detik)</label><input type="number" data-k="utils.chat-messages.repeat-delay" inputmode="numeric">
    <label>Pesan chat (satu per baris)</label><textarea id="msgs" rows="4"></textarea>
  </div>
  <button class="go" id="save">Simpan &amp; restart bot</button>
</section>
</main>

<nav>
  <button class="on" data-t="status">Status</button>
  <button data-t="logs">Log</button>
  <button data-t="settings">Pengaturan</button>
</nav>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const get=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const put=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x]=a[x]||{},o)[l]=v};
const fmt=s=>{const h=s/3600|0,m=s%3600/60|0;return h?h+'j '+m+'m':m?m+'m '+(s%60)+'d':s+'d'};
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2800)}
async function api(u,b,m){const r=await fetch(u,{method:m||(b===undefined?'GET':'POST'),headers:{'Content-Type':'application/json'},body:b==null?undefined:JSON.stringify(b)});return r.json()}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let tk='';

$$('nav button').forEach(b=>b.onclick=()=>{
  $$('nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('section').forEach(s=>s.classList.toggle('show',s.id==='t-'+b.dataset.t));
  if(b.dataset.t==='logs')logs(true);
});

async function status(){
  try{
    const d=await api('/health'),B=d.bots||[],on=B.filter(b=>b.connected).length,run=B.some(b=>b.running);
    $('#dot').className='dot '+(on?'on':run?'wait':'');
    $('#st').textContent=on?on+' dari '+B.length+' bot terhubung':run?'Mencoba masuk…':'Semua bot berhenti';
    $('#sd').textContent=on?'Bot aktif di server':run?'Menunggu server / reconnect':'Tekan Start untuk menyalakan';
    $('#cnt').textContent=on+' / '+B.length;
    $('#start').disabled=B.every(b=>b.running);$('#stop').disabled=!run;
    $('#bots').replaceChildren(...B.map(b=>{
      const d=document.createElement('div');d.className='card bot';
      const pos=b.connected&&b.coords?[b.coords.x,b.coords.y,b.coords.z].map(Math.floor).join(', ')+' · '+fmt(b.uptime):b.running?'Mencoba masuk…':'Berhenti';
      d.innerHTML='<div class="dot '+(b.connected?'on':b.running?'wait':'')+'"></div><div class="info"><b>'+esc(b.id)+'</b>'+(b.main?'<span class="tag">utama</span>':'')+'<div class="mu">'+pos+'</div></div>'
        +'<button data-id="'+esc(b.id)+'" data-a="'+(b.running?'stop':'start')+'" class="'+(b.running?'stop':'go')+'">'+(b.running?'Stop':'Start')+'</button>'
        +(b.main?'':'<button data-id="'+esc(b.id)+'" data-a="del">✕</button>');
      return d}));
    const k=B.map(b=>b.id).join();
    if(k!==tk){tk=k;const v=$('#tgt').value;$('#tgt').innerHTML='<option value="all">Semua bot</option>'+B.map(b=>'<option>'+esc(b.id)+'</option>').join('');$('#tgt').value=[...$('#tgt').options].some(o=>o.value===v)?v:'all'}
  }catch(e){$('#st').textContent='Panel tidak terjangkau'}
}

$('#bots').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=encodeURIComponent(b.dataset.id),a=b.dataset.a;
  const d=a==='del'?await api('/api/bots/'+id,null,'DELETE'):await api('/api/bots/'+id+'/'+a,{});
  toast(d.success?'OK':d.msg);setTimeout(status,500);
};
$('#add').onclick=async()=>{
  const i=$('#newbot'),d=await api('/api/bots',{username:i.value.trim()});
  toast(d.success?'Bot ditambahkan, sedang masuk…':d.msg);if(d.success)i.value='';setTimeout(status,500);
};

async function logs(force){
  const box=$('#log'),near=force||box.scrollHeight-box.scrollTop-box.clientHeight<60;
  try{
    const {logs}=await api('/api/logs');
    box.replaceChildren(...logs.map(l=>{
      const d=document.createElement('div'),x=l.toLowerCase();
      d.className=/error|fail|fatal|kicked/.test(x)?'e':/warn|disconnect|reconnect/.test(x)?'w':/\[control\]|\[console\]/.test(x)?'c':/connected|spawned/.test(x)?'s':'';
      d.textContent=l;return d;
    }));
    if(near)box.scrollTop=box.scrollHeight;
  }catch(e){}
}

async function send(){
  const i=$('#cmd'),c=i.value.trim();if(!c)return;
  i.value='';await api('/command',{command:c,bot:$('#tgt').value});logs(true);
}
$('#send').onclick=send;
$('#cmd').onkeydown=e=>{if(e.key==='Enter')send()};

$('#start').onclick=async()=>{const d=await api('/api/bots/all/start',{});toast(d.success?'Menyalakan semua bot…':d.msg);setTimeout(status,800)};
$('#stop').onclick=async()=>{const d=await api('/api/bots/all/stop',{});toast(d.success?'Semua bot dihentikan':d.msg);status()};

async function load(){
  const c=await api('/api/config');
  $$('[data-k]').forEach(e=>{const v=get(c,e.dataset.k);if(e.type==='checkbox')e.checked=!!v;else e.value=v??''});
  $('#msgs').value=(get(c,'utils.chat-messages.messages')||[]).join('\n');
  $('#srv').textContent=c.server.ip+':'+c.server.port;
}
$('#save').onclick=async()=>{
  const o={};
  $$('[data-k]').forEach(e=>put(o,e.dataset.k,e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value):e.value));
  put(o,'utils.chat-messages.messages',$('#msgs').value.split('\n').map(s=>s.trim()).filter(Boolean));
  const d=await api('/api/config',o);
  toast(d.success?'Tersimpan. Bot restart…':d.msg);
  if(d.success){load();setTimeout(status,4000)}
};

load();status();
setInterval(status,4000);
setInterval(()=>{if($('#t-logs').classList.contains('show'))logs()},3000);
</script></body></html>
